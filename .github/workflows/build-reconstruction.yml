name: Build Reconstruction

on:
  push:
    branches:
      - reconstruction-514
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # No separate Android SDK setup step: ubuntu-latest already ships an
      # Android SDK (ANDROID_HOME), and the upstream build-apk.yml in this
      # repo builds compileSdk 35 the same way, with only JDK + Gradle setup.
      # The previous android-actions/setup-android@v3 step failed the whole
      # run (run 41167566516) before Gradle ever started, so it is removed
      # rather than retried unchanged.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build reconstruction debug APK
        working-directory: reconstruction
        run: gradle assembleDebug --stacktrace

      - name: Run reconstruction unit tests
        working-directory: reconstruction
        run: gradle testDebugUnitTest --stacktrace

      - name: Upload reconstruction APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anyclaw-reconstruction
          path: reconstruction/app/build/outputs/apk/debug/app-debug.apk
