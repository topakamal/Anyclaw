name: Build Reconstruction

on:
  push:
    branches:
      - reconstruction-514
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || echo "sdkmanager step did not complete; continuing to Gradle"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build reconstruction debug APK
        working-directory: reconstruction
        run: gradle assembleDebug --stacktrace

      - name: Run reconstruction unit tests
        working-directory: reconstruction
        run: gradle testDebugUnitTest --stacktrace

      - name: Upload reconstruction APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anyclaw-reconstruction
          path: reconstruction/app/build/outputs/apk/debug/app-debug.apk
